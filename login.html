<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#fbf4f1">
<title>Entrar · StoryKit Pro</title>
<style>*{box-sizing:border-box;margin:0;padding:0}body{min-height:100vh;display:grid;place-items:center;padding:24px;background:#fbf4f1 radial-gradient(circle at 15% 10%,#fff 0,transparent 45%),radial-gradient(circle at 90% 90%,#f6d5df 0,transparent 50%);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;color:#2a1f23}
.box{width:100%;max-width:400px;background:#fff;border:1px solid #efe3e2;border-radius:26px;padding:32px 24px;text-align:center;box-shadow:0 20px 50px rgba(150,80,100,.12)}
.logo{font:italic 700 40px/1 Georgia,serif;color:#d9809b}.logo b{font:800 14px system-ui;letter-spacing:.3em;color:#2a1f23;font-style:normal;margin-left:6px;vertical-align:middle}
h1{font-size:19px;margin:18px 0 6px}p{color:#7a6a70;font-size:14px}
label{display:block;text-align:left;font-weight:600;font-size:14px;margin:22px 0 6px}
input{width:100%;font:inherit;font-size:17px;padding:14px 16px;border:1px solid #e6d6d8;border-radius:14px}
input:focus{outline:3px solid #f2c4d1;border-color:#d9809b}
button{width:100%;margin-top:14px;padding:15px;border:0;border-radius:14px;font:700 17px system-ui;color:#fff;background:linear-gradient(135deg,#e58fa9,#c9607f);cursor:pointer}
.err{display:none;margin-top:14px;color:#b3264f;font-weight:600;font-size:14px}.show{display:block}
small{display:block;margin-top:18px;color:#9a8a90;font-size:12.5px}</style></head>
<body><main class="box">
<div class="logo">StoryKit<b>PRO</b></div>
<h1>Área das suas figurinhas</h1>
<p>Digite a senha que está na sua área de membros da Kiwify.</p>
<form method="post" action="/entrar">
<label for="s">Senha</label>
<input id="s" name="senha" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" required>
<button type="submit">Entrar</button>
<p class="err" id="e" role="alert">Senha incorreta. Confira na aula da Kiwify, com letras maiúsculas e minúsculas iguais.</p>
</form>
<small>Acesso exclusivo para assinantes. Não compartilhe a senha.</small>
</main>
<script>if(location.search.includes("erro"))document.getElementById("e").classList.add("show")</script>
</body></html>
